<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // SPA redirect: GitHub Pages serves this for unknown routes.
      // Redirect to index.html with the path preserved as a query param,
      // then the app shell picks up the route.
      var path = window.location.pathname;
      window.location.replace('/' + '?p=' + encodeURIComponent(path));
    </script>
  </head>
  <body></body>
</html>
